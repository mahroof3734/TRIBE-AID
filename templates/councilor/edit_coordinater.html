{% extends 'councilor/councilor_index.html' %}
{% block body %}

<body>
<form action="/myapp/edit_coordinater_post/" method="post" enctype="multipart/form-data" name="form1" id="form1">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ data.id }}">
  <table width="200" border="1">
    <tr>
      <th>Name</th>
      <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield"  value="{{ data.name }} "required/></td>
    </tr>
    <tr>
      <th>Photo</th>
      <td><img src="{{ data.photo }}" width="90" height="90">
      <input type="file" name="fileField" id="fileField" required/></td>
    </tr>
    <tr>
      <th>Email</th>
      <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" value="{{ data.email }}"required/></td>
    </tr>
    <tr>
      <th>Gender</th>
      <td><p>
        <label>
          <input type="radio" name="RadioGroup1"{% if data.gender == 'male' %} checked {% endif %} value="male" id="RadioGroup1_0" />
          male</label>
        <br />
        <label>
          <input type="radio" name="RadioGroup1" {% if data.gender == 'female' %} checked {% endif %} value="female" id="RadioGroup1_1" />
          female</label>
        <br />
      </p></td>
    </tr>
    <tr>
      <th>Dob</th>
      <td><label for="textfield4"></label>
      <input type="date" name="textfield4" id="textfield4" value="{{ data.dob|date:'Y-m-d' }}"required/></td>
    </tr>
    <tr>
      <th>Phone</th>
      <td><label for="textfield5"></label>
      <input type="text" name="textfield5" id="textfield5" value="{{ data.phone }}"required/></td>
    </tr>
    <tr>
      <th>Place</th>
      <td><label for="textfield6"></label>
      <input type="text" name="textfield6" id="textfield6"  value="{{ data.place }}"required/></td>
    </tr>
    <tr>
      <th>Post</th>
      <td><label for="textfield7"></label>
      <input type="text" name="textfield7" id="textfield7"  value="{{ data.post }}"required/></td>
    </tr>
    <tr>
      <th>District</th>
      <td><label for="textfield8"></label>
      <input type="text" name="textfield8" id="textfield8"  value="{{ data.district }}"required/></td>
    </tr>
    <tr>
      <th>State</th>
      <td><label for="textfield9"></label>
      <input type="text" name="textfield9" id="textfield9"  value="{{ data.state }}"required/></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td><input type="submit" name="submit" id="submit" value="Submit" /></td>
    </tr>
  </table>
</form>
</body>
{% endblock %}
