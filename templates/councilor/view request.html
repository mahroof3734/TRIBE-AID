{% extends 'councilor/councilor_index.html' %}
{% block body %}
<body>


<form id="form1" name="form1" method="post" action="/myapp/view_request_post/"><table width="200" border="1">
    {% csrf_token %}
<table width="200" border="1">
  <tr>
    <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" required/></td>
    <td><input type="submit" name="button" id="button" value="search"  /></td>
  </tr>
</table>


<table width="200" border="1">
<tr>
    <th>S/no</th>
    <th>Service name</th>
    <th>Date</th>
    <th>Status</th>
    <th>TRIBE</th>
{#    <th>&nbsp;</th>#}
{#    <th>&nbsp;</th>#}
  </tr>
    {% for i in data %}
  <tr>
      <td>{{ forloop.counter }}</td>
    <td>{{ i.service_name }}</td>
    <td>{{ i.date }}</td>
    <td>{{ i.status }}</td>
    <td>{{ i.TRIBE.name }}</td>
  </tr>
       {% endfor %}
</table>
</form>
</body>
{% endblock %}
