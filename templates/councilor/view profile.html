{% extends 'councilor/councilor_index.html' %}
{% block body %}
<body>
<form enctype="multipart/form-data">
    <table width="200" border="1">
        <tr>
            <th>Name</th>
            <td>{{ data.name }}</td>
        </tr>
           <tr>
            <th>Email</th>
            <td>{{ data.email }}</td>
        </tr>
           <tr>
            <th>Phone</th>
            <td>{{ data.phone }}</td>
        </tr>
         <tr>
            <th>Photo</th>
            <td><img src="{{ data.photo }}" width="90" height="90"></td>
        </tr>
         <tr>
            <th>Gender</th>
            <td>{{ data.gender }}</td>
        </tr>
         <tr>
            <th>Dob</th>
            <td>{{ data.dob }}</td>
        </tr>
         <tr>
            <th>Place</th>
            <td>{{ data.place }}</td>
        </tr>
         <tr>
            <th>District</th>
            <td>{{ data.district }}</td>
        </tr>
         <tr>
            <th>Post</th>
            <td>{{ data.post }}</td>
        </tr>
         <tr>
            <th>State</th>
             <td>{{ data.state}}</td>
        </tr>
    </table>
</form>
</body>
{% endblock %}
