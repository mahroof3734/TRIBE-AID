{% extends 'admin/admin_index.html' %}
{% block body %}
<body><form action="/myapp/edit_district_post/" method="post"><table width="200" border="1">
    {% csrf_token %}
    <input type="hidden" value="{{ data.id }}" name="id">
 <tr>
    <th>Name</th>
    <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" value="{{ data.name }}" required/></td>
  </tr>
  <tr>
    <th>Email</th>
    <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" value="{{ data.email }}"required/></td>
  </tr>
  <tr>
    <th>Phone</th>
    <td><label for="textfield3"></label>
      <input type="text" name="textfield3" id="textfield3" value="{{ data.phone }}" required/></td>
  </tr>
  <tr>
    <th>Gender      </th>
    <td><p>
      <label>
        <input type="radio" name="RadioGroup1" value="male" {% if data.gender == 'male' %}checked{% endif %} id="RadioGroup1_0" />
        male</label>
      <br />
      <label>
        <input type="radio" name="RadioGroup1" value="female" {% if data.gender == 'female' %}checked{% endif %}id="RadioGroup1_1" />
        female</label>
      <br />
      <br />
    </p></td>
  </tr>
  <tr>
    <th>DOB</th>
    <td><label for="textfield4"></label>
      <input type="date" name="textfield4" id="textfield4" value="{{ data.dob }}" required /></td>
  </tr>
  <tr>
    <th>Photo</th>
    <td><label for="textfield5"></label>
        <img src="{{ data.photo}}" height="50px" width="50px">
      <input type="file" name="textfield5" id="textfield5" /></td>
  </tr>
  <tr>
    <th>Place</th>
    <td><label for="textfield6"></label>
      <input type="text" name="textfield6" id="textfield6" value="{{ data.place }}" required /></td>
  </tr>
  <tr>
    <th>Post</th>
    <td><label for="textfield7"></label>
      <input type="text" name="textfield7" id="textfield7" value="{{ data.post }}" required /></td>
  </tr>
  <tr>
    <th>Pin</th>
    <td><label for="textfield8"></label>
      <input type="text" name="textfield8" id="textfield8" value="{{ data.pin }}" required /></td>
  </tr>
  <tr>
    <th>District</th>
    <td><label for="textfield9"></label>
      <input type="text" name="textfield9" id="textfield9" value="{{ data.district }}" required/></td>
  </tr>
     <tr>
    <th>Working district</th>
    <td><label for="textfield11"></label>
      <input type="text" name="textfield11" id="textfield9" value="{{ data.workingdistrict }}" required/></td>
  </tr>
  <tr>
    <th>State</th>
    <td><label for="textfield10"></label>
      <input type="text" name="textfield10" id="textfield10" value="{{ data.state }}" required/></td>
  </tr>
  <tr>
    <td colspan=""><input type="submit" name="button" id="button" value="Submit" required/></td>
    <td>&nbsp;</td>
  </tr>
</table>
</form>
</body>
{% endblock %}
