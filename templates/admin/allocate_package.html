{% extends 'admin/admin_index.html' %}
{% block body %}


<body>
<form id="form1" name="form1" method="post" action="/myapp/allocate_package_post/">
    {% csrf_token %}
  <table width="200" border="1">
    <tr>
      <th>District</th>
      <td><label for="select"></label>
        <select name="select" id="select">
            <option value="kasargod">kasargod</option>
            <option value="kannur">kannur</option>
            <option value="kozhikode">kozhikode</option>
            <option value="wayanad">wayanad</option>
            <option value="malappuram">malappuram</option>
            <option value="palakkad">palakkad</option>
            <option value="thrissur">thrissur</option>
            <option value="ernamkulam">ernamkulam</option>
            <option value="idukki">idukki</option>
            <option value="kottayam">kottayam</option>
            <option value="pathanamthitta">pathanamthitta</option>
            <option value="alappuzha">alappuzha</option>
            <option value="kollam">kollam</option>
            <option value="thiruvananthapuram">thiruvananthapuram</option>
      </select></td>
    </tr>
    <tr>
      <th>Package</th>
      <td><label for="select2"></label>
        <select name="select2" id="select2">
            {% for i in data %}
                <option value="{{ i.id }}">{{ i.name }}</option>
            {% endfor %}


      </select></td>
    </tr>
    <tr>
      <th>Alloted amount</th>
      <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" required /></td>
    </tr>
    <tr>
         <td>&nbsp;</td>
      <td><input type="submit" name="button" id="button" value="Allocate" style="background-color: :" required /></td>

    </tr>
  </table>
</form>
</body>
{% endblock %}
