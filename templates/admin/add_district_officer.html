{% extends 'admin/admin_index.html' %}
{% block body %}



<body><form action="/myapp/add_district_post/" method="post"enctype="multipart/form-data">
    <table class="table table-bordered" border="1">
    {% csrf_token %}
  <tr>
    <th>Name</th>
    <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield"  class="form-control"  required/></td>
  </tr>
  <tr>
    <th>Email</th>
    <td><label for="textfield2"></label>
      <input type="text" name="textfield2" id="textfield2" required class="form-control"/></td>
  </tr>
  <tr>
    <th>Phone</th>
    <td><label for="textfield3"></label>
      <input type="text" name="textfield3" id="textfield3" required class="form-control"/></td>
  </tr>
  <tr>
    <th>Gender      </th>
    <td><p>
      <label>
        <input type="radio" name="RadioGroup1" value="male" id="RadioGroup1_0" />
        male</label>
      <br />
      <label>
        <input type="radio" name="RadioGroup1" value="female" id="RadioGroup1_1" />
        female</label>
      <br />
      <br />
    </p></td>
  </tr>
  <tr>
    <th>DOB</th>
    <td><label for="textfield4"></label>
      <input type="date" name="textfield4" id="textfield4" required class="form-control"/></td>
  </tr>
  <tr>
    <th>Photo</th>
    <td><label for="textfield5"></label>
      <input type="file" name="textfield5" id="textfield5" required class="form-control"/></td>
  </tr>
  <tr>
    <th>Place</th>
    <td><label for="textfield6"></label>
      <input type="text" name="textfield6" id="textfield6" required class="form-control"/></td>
  </tr>
  <tr>
    <th>Post</th>
    <td><label for="textfield7"></label>
      <input type="text" name="textfield7" id="textfield7" required class="form-control"/></td>
  </tr>
  <tr>
    <th>Pin</th>
    <td><label for="textfield8"></label>
      <input type="text" name="textfield8" id="textfield8" required class="form-control"/></td>
  </tr>
  <tr>
    <th>District</th>
    <td><label for="textfield9"></label>
      <input type="text" name="textfield9" id="textfield9" required class="form-control"/></td>
  </tr>
     <tr>
    <th>Working district</th>
    <td><label for="textfield11"></label>
      <input type="text" name="textfield11" id="textfield9" required class="form-control"/></td>
  </tr>
  <tr>
    <th>State</th>
    <td><label for="textfield10"></label>
      <input type="text" name="textfield10" id="textfield10" required class="form-control"/></td>
  </tr>
  <tr>
        <td>&nbsp;</td>
    <td colspan=""><input type="submit" name="button" id="button" value="Submit" class="btn btn-danger"/></td>

  </tr>
</table>
</form>
</body>
{% endblock %}
