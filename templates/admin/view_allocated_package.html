{% extends 'admin/admin_index.html' %}
{% block body %}
<body>



<form id="form1" name="form1" method="post" action="/myapp/view_allocated_post/">
    {% csrf_token %}
<table width="200" border="1">
  <tr>
    <td><label for="textfield"></label>
      <input type="text" name="textfield" id="textfield" required/></td>
    <td><input type="submit" name="button3" id="button3" value="Search" /></td>
  </tr>
</table>
  <table width="200" border="1">
    <tr>
      <th>S/no</th>
      <th>Date</th>
      <th>Package</th>
      <th>District</th>
      <th>Alloted amount</th>
      <th>&nbsp;</th>
      <td>&nbsp;</td>
    </tr>
        {% for i in data %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ i.date }}</td>
      <td>{{ i.PACKAGE.name}}</td>
      <td>{{ i.district }}</td>
      <td>{{ i.alloted_amount }} </td>
              <td><a href="/myapp/edit_allocated/{{ i.id }}#a">Edit</a></td>

      <td><a href="/myapp/delete_allocated_package/{{ i.id }}">Delete</a></td>
    </tr>
      {% endfor %}
  </table>
</form>
</body>
{% endblock %}
